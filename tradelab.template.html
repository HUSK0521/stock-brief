<title>TradeLab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+TC:wght@400;500;700&display=swap">
<style>
:root{
  --bg:#080A0F; --card:#10131A; --sub:#151923; --bd:#242936; --bd2:#2E3547;
  --tx:#F5F7FA; --tx2:#8B93A3; --tx3:#5C6472;
  --up:#E5484D; --up-dim:#3A1618; --down:#12A594; --down-dim:#0C2E2B;
  --acc:#4C7DF0; --acc-dim:#141F3A; --pur:#8B5CF6; --warn:#E8A33D; --warn-dim:#33260E;
  --sans:"Noto Sans TC",-apple-system,"PingFang TC","Microsoft JhengHei",sans-serif;
  --num:"Inter",ui-sans-serif,system-ui,sans-serif;
  --r:7px; --sh:0 1px 2px rgba(0,0,0,.5), 0 6px 20px -12px rgba(0,0,0,.9);
  --side:216px; --top:52px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{color-scheme:dark}
body{background:var(--bg);color:var(--tx);font-family:var(--sans);font-size:13px;
  line-height:1.55;-webkit-font-smoothing:antialiased}
.num,.n{font-family:var(--num);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
button,input,select{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer}
svg{display:block}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:var(--bd2);border-radius:5px}
::-webkit-scrollbar-track{background:transparent}

.app{display:grid;grid-template-columns:var(--side) 1fr;min-height:100vh}
aside{background:var(--card);border-right:1px solid var(--bd);position:sticky;top:0;
  height:100vh;display:flex;flex-direction:column;overflow-y:auto;z-index:40}
.logo{display:flex;align-items:center;gap:9px;padding:0 18px;border-bottom:1px solid var(--bd);
  height:var(--top);flex-shrink:0}
.logo .mk{width:22px;height:22px;border-radius:5px;background:linear-gradient(135deg,var(--acc),var(--pur));
  display:grid;place-items:center;font-family:var(--num);font-weight:700;font-size:12px;color:#fff}
.logo b{font-family:var(--num);font-size:15px;font-weight:600;letter-spacing:-.02em}
nav{padding:10px 9px;display:flex;flex-direction:column;gap:1px}
.nav-lab{font-family:var(--num);font-size:10px;letter-spacing:.11em;text-transform:uppercase;
  color:var(--tx3);padding:14px 9px 6px;font-weight:600}
nav a{display:flex;align-items:center;gap:10px;padding:7px 9px;border-radius:6px;
  color:var(--tx2);text-decoration:none;font-size:13px;transition:.12s}
nav a:hover{background:var(--sub);color:var(--tx)}
nav a.on{background:var(--acc-dim);color:#A9C2FA;font-weight:500}
nav a svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.6;
  stroke-linecap:round;stroke-linejoin:round;opacity:.75;flex-shrink:0}
nav a.on svg{opacity:1;stroke:var(--acc)}
.side-ft{margin-top:auto;padding:12px 18px;border-top:1px solid var(--bd);
  font-family:var(--num);font-size:10.5px;color:var(--tx3);line-height:1.6}
.ibtn.burger{display:none}

main{min-width:0}
header{height:var(--top);border-bottom:1px solid var(--bd);background:rgba(16,19,26,.86);
  backdrop-filter:blur(12px);position:sticky;top:0;z-index:30;display:flex;align-items:center;
  gap:12px;padding:0 16px}
.srch{position:relative;flex:0 1 340px;min-width:0}
.srch input{width:100%;background:var(--sub);border:1px solid var(--bd);border-radius:6px;
  padding:6px 10px 6px 30px;font-size:12.5px;color:var(--tx)}
.srch input::placeholder{color:var(--tx3)}
.srch input:focus{outline:none;border-color:var(--acc)}
.srch .mag{position:absolute;left:9px;top:50%;transform:translateY(-50%);width:14px;height:14px;
  stroke:var(--tx3);fill:none;stroke-width:1.8}
.srch ul{position:absolute;top:34px;left:0;right:0;background:var(--card);border:1px solid var(--bd2);
  border-radius:6px;list-style:none;max-height:330px;overflow-y:auto;box-shadow:var(--sh);z-index:50}
.srch ul:empty{display:none}
.srch li{display:flex;align-items:center;gap:9px;padding:7px 11px;cursor:pointer;font-size:12.5px;
  border-bottom:1px solid var(--bd)}
.srch li:last-child{border:0}
.srch li:hover{background:var(--sub)}
.srch li.sel{background:var(--acc-dim);box-shadow:inset 2px 0 0 var(--acc)}
.srch li .cd{font-family:var(--num);color:var(--tx2);width:56px;font-size:11.5px;flex-shrink:0}
.srch li .pc{margin-left:auto;font-family:var(--num);font-size:11.5px}
.srch li .ind{font-size:10.5px;color:var(--tx3);margin-left:6px}
.srch .grp{padding:5px 11px;font-family:var(--num);font-size:9.5px;letter-spacing:.1em;
  text-transform:uppercase;color:var(--tx3);background:var(--sub);
  border-top:1px solid var(--bd);border-bottom:1px solid var(--bd)}
.srch ul{max-height:420px}
.srch li.indrow{background:rgba(76,125,240,.07)}
.srch li.indrow .cd{color:var(--acc)}
.srch li .nsig{font-family:var(--num);font-size:10px;font-weight:600;background:var(--acc-dim);
  color:#8FB0F5;border-radius:3px;padding:1px 5px;margin-left:6px}
.srch .hdr{padding:6px 11px;font-family:var(--num);font-size:10px;letter-spacing:.08em;
  text-transform:uppercase;color:var(--tx3);border-bottom:1px solid var(--bd);
  display:flex;justify-content:space-between}
.srch .none{padding:14px 11px;font-size:12.5px;color:var(--tx3)}
.srch li .lite{font-family:var(--num);font-size:10px;color:var(--tx3);border:1px solid var(--bd2);
  border-radius:3px;padding:0 4px;margin-left:6px}
.top-r{margin-left:auto;display:flex;align-items:center;gap:8px}
.mkt-pill{display:flex;align-items:center;gap:7px;background:var(--sub);border:1px solid var(--bd);
  border-radius:999px;padding:4px 11px;font-family:var(--num);font-size:11.5px;white-space:nowrap}
.dot{width:6px;height:6px;border-radius:50%;background:var(--tx3)}
.ibtn{width:30px;height:30px;border-radius:6px;display:grid;place-items:center;color:var(--tx2);
  position:relative;flex-shrink:0}
.ibtn svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.6;
  stroke-linecap:round;stroke-linejoin:round}
.ibtn:hover{background:var(--sub);color:var(--tx)}
.badge{position:absolute;top:4px;right:4px;width:6px;height:6px;border-radius:50%;background:var(--up)}
.usr{display:flex;align-items:center;gap:8px;padding:3px 4px 3px 8px;border-left:1px solid var(--bd)}
.av{width:26px;height:26px;border-radius:6px;background:linear-gradient(135deg,#3C4A6B,#5B4A8A);
  display:grid;place-items:center;font-family:var(--num);font-size:11px;font-weight:600}
.usr span{font-size:12px;color:var(--tx2)}

.page{padding:18px 22px 60px;max-width:1840px;margin:0 auto}
.ph{display:flex;align-items:flex-end;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.ph h1{font-size:19px;font-weight:600;letter-spacing:-.01em}
.ph .sub{font-family:var(--num);font-size:11.5px;color:var(--tx3);margin-bottom:2px}
.ph .rt{margin-left:auto;display:flex;gap:7px;align-items:center;flex-wrap:wrap}

/* 資料時效帶：#2 盤中是死的 → 講清楚 */
.stale{display:flex;align-items:center;gap:9px;background:var(--warn-dim);border:1px solid #4A3714;
  border-radius:6px;padding:7px 12px;font-size:12px;color:#F0C078;margin-bottom:14px}
.stale svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.7;flex-shrink:0}

.card{background:var(--card);border:1px solid var(--bd);border-radius:var(--r)}
.ch{display:flex;align-items:center;gap:9px;padding:11px 14px;border-bottom:1px solid var(--bd);flex-wrap:wrap}
.ch h3{font-size:12.5px;font-weight:600}
.ch .hint{font-family:var(--num);font-size:10.5px;color:var(--tx3);margin-left:auto}
.cb{padding:14px}
.grid{display:grid;gap:12px}
.g4{grid-template-columns:repeat(4,1fr)}
.g3{grid-template-columns:repeat(3,1fr)}
.g2{grid-template-columns:repeat(2,1fr)}
.tag{display:inline-flex;align-items:center;gap:5px;font-family:var(--num);font-size:10px;
  font-weight:600;letter-spacing:.05em;padding:2px 7px;border-radius:4px;text-transform:uppercase}
.t-up{background:var(--up-dim);color:var(--up)}
.t-dn{background:var(--down-dim);color:var(--down)}
.t-ac{background:var(--acc-dim);color:#8FB0F5}
.t-nu{background:var(--sub);color:var(--tx2)}
.t-wn{background:var(--warn-dim);color:var(--warn)}
.up{color:var(--up)} .dn{color:var(--down)} .mu{color:var(--tx2)} .fa{color:var(--tx3)}
.btn{background:var(--sub);border:1px solid var(--bd);border-radius:6px;padding:5px 11px;
  font-size:12px;color:var(--tx2);white-space:nowrap}
.btn:hover{border-color:var(--bd2);color:var(--tx)}
.btn.pri{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:500}
.btn.on{background:var(--acc-dim);border-color:var(--acc);color:#A9C2FA}
/* 翻頁數字：每個數位是一條 0-9 的直條，靠 translateY 捲到目標數字 */
.odo{display:inline-flex;align-items:baseline;font-variant-numeric:tabular-nums}
.odo .odg{display:inline-block;overflow:hidden;height:1em;line-height:1em;vertical-align:baseline}
.odo .odc{display:block;transition:transform .55s cubic-bezier(.22,1,.36,1)}
.odo .odc span{display:block;height:1em;line-height:1em}
.odo .ods{display:inline-block}
.odo.tick{animation:odoTick .55s}
@keyframes odoTick{0%{filter:brightness(1)}30%{filter:brightness(1.5)}100%{filter:brightness(1)}}
@media (prefers-reduced-motion:reduce){
  .odo .odc{transition:none}
  .odo.tick{animation:none}
}
/* 即時狀態列 */
.live{display:inline-flex;align-items:center;gap:6px;font-family:var(--num);font-size:11px;
  color:var(--tx3)}
.live .pulse{width:6px;height:6px;border-radius:50%;background:var(--down);
  box-shadow:0 0 0 0 rgba(18,165,148,.6);animation:pulse 2.4s infinite}
.live.off .pulse{background:var(--tx3);animation:none;box-shadow:none}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(18,165,148,.5)}
  70%{box-shadow:0 0 0 7px rgba(18,165,148,0)}100%{box-shadow:0 0 0 0 rgba(18,165,148,0)}}
@media (prefers-reduced-motion:reduce){.live .pulse{animation:none}}
.stat .k{font-family:var(--num);font-size:10.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--tx3)}
.stat .v{font-family:var(--num);font-size:22px;font-weight:600;letter-spacing:-.02em;margin-top:3px}
.stat .d{font-family:var(--num);font-size:12px;margin-top:1px}

/* Regime 是產品核心，給它跟其他卡片不同的視覺重量 */
.regime{display:grid;grid-template-columns:300px 1fr;background:
  radial-gradient(1100px 240px at 6% 0%, rgba(76,125,240,.10), transparent 60%), var(--card)}
.rg-l{padding:22px 24px;border-right:1px solid var(--bd);display:flex;flex-direction:column}
.rg-state{font-family:var(--sans);font-size:34px;font-weight:700;letter-spacing:.01em;
  line-height:1.1;margin-top:11px}
.rg-en{font-family:var(--num);font-size:11px;letter-spacing:.16em;color:var(--tx3);margin-top:5px}
.conf-ring{display:flex;align-items:center;gap:13px;margin-top:18px}
.conf-ring svg{width:56px;height:56px;flex-shrink:0}
.conf-ring .cnum{font-family:var(--num);font-size:22px;font-weight:700;letter-spacing:-.02em;line-height:1}
.conf-ring .clab{font-family:var(--num);font-size:10px;letter-spacing:.12em;text-transform:uppercase;
  color:var(--tx3);margin-bottom:3px}

/* 八個分項放在同一條 0-100 軸上，一眼看出誰脫隊 */
.rg-r{padding:22px 26px 18px;display:flex;flex-direction:column}
.axis{position:relative;height:172px;margin:22px 0 4px}
.axis .grid-l{position:absolute;top:0;bottom:20px;width:1px;background:var(--bd)}
.axis .base{position:absolute;left:0;right:0;bottom:20px;height:1px;background:var(--bd2)}
.axis .grid-t{position:absolute;bottom:0;transform:translateX(-50%);font-family:var(--num);
  font-size:10px;color:var(--tx3)}
.axis .band{position:absolute;top:0;bottom:20px;background:rgba(139,147,163,.06);
  border-left:1px dashed var(--bd);border-right:1px dashed var(--bd)}
.axm{position:absolute;transform:translateX(-50%);text-align:center}
.axm .dot{width:10px;height:10px;border-radius:50%;margin:0 auto;border:2px solid var(--card)}
.axm .v{font-family:var(--num);font-size:13.5px;font-weight:700;letter-spacing:-.02em;margin-bottom:3px}
.axm .l{font-family:var(--num);font-size:9.5px;color:var(--tx2);margin-top:3px;white-space:nowrap}
.axm .stem{position:absolute;left:50%;width:1px;background:var(--bd2);transform:translateX(-50%);z-index:-1}
.rgh{display:flex;gap:1px;margin-top:14px;border-radius:3px;overflow:hidden}
.rgh i{flex:1;height:20px;cursor:help}
.rgh-lab{display:flex;justify-content:space-between;font-family:var(--num);font-size:9.5px;
  color:var(--tx3);margin-top:5px}
.sec-t{display:flex;align-items:baseline;gap:8px}
.sec-t b{font-size:12.5px;font-weight:600}
.sec-t span{font-size:11px;color:var(--tx3)}

.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:12.5px}
thead th{font-family:var(--num);font-size:10px;letter-spacing:.07em;text-transform:uppercase;
  color:var(--tx3);font-weight:600;text-align:right;padding:8px 10px;border-bottom:1px solid var(--bd);
  white-space:nowrap;position:sticky;top:0;background:var(--card);cursor:pointer;user-select:none;z-index:2}
thead th:first-child,tbody td:first-child{text-align:left}
thead th:hover{color:var(--tx2)}
thead th.srt{color:var(--acc)}
tbody td{padding:7px 10px;border-bottom:1px solid rgba(36,41,54,.6);text-align:right;
  font-family:var(--num);font-variant-numeric:tabular-nums;white-space:nowrap}
tbody tr:hover{background:var(--sub)}
tbody tr{cursor:pointer}
.nm{font-family:var(--sans);font-weight:500}
.cd2{font-family:var(--num);font-size:10.5px;color:var(--tx3);display:block;line-height:1.3}
.mini{height:3px;background:var(--sub);border-radius:2px;margin-top:3px;overflow:hidden}
.mini i{display:block;height:100%;border-radius:2px}
.rk{font-family:var(--num);font-size:11.5px;padding:1px 5px;border-radius:3px;font-weight:600}

.feed{display:flex;flex-direction:column}
.ev{display:grid;grid-template-columns:120px 1fr;gap:12px;padding:11px 14px;border-bottom:1px solid var(--bd)}
.ev:last-child{border:0}
.ev:hover{background:var(--sub)}
.ev-t{font-family:var(--num);font-size:10.5px;color:var(--tx3);padding-top:2px}
.ev-t .edge{display:block;margin-top:3px;font-size:10px}
.ev h4{font-size:13px;font-weight:600;margin-bottom:2px}
.ev p{font-size:12px;color:var(--tx2);line-height:1.55}

#hm{position:relative;width:100%;height:min(72vh,760px);background:var(--bg);border-radius:6px;overflow:hidden}
.hm-cell{position:absolute;border:1px solid var(--bg);overflow:hidden;display:flex;
  flex-direction:column;justify-content:center;align-items:center;padding:3px;cursor:pointer}
.hm-cell:hover{outline:1px solid var(--tx);outline-offset:-1px;z-index:5}
.hm-cell b{font-weight:500;line-height:1.15;text-align:center}
.hm-cell i{font-family:var(--num);font-style:normal;opacity:.82;line-height:1.2}
.hm-grp{position:absolute;border:1px solid var(--bd2);border-radius:4px;pointer-events:none}
.hm-lab{position:absolute;font-family:var(--num);font-size:10px;color:var(--tx2);
  padding:1px 5px;background:var(--bg);border-radius:3px;pointer-events:none;z-index:6}

.split{display:grid;grid-template-columns:1fr 320px;gap:12px}
.kv{display:flex;justify-content:space-between;gap:10px;padding:6px 0;
  border-bottom:1px solid rgba(36,41,54,.5);font-size:12.5px}
.kv:last-child{border:0}
.kv span{color:var(--tx2)}
.kv b{font-family:var(--num);font-weight:600;text-align:right}
.note{font-size:11.5px;color:var(--tx3);line-height:1.65}
.empty{padding:38px;text-align:center;color:var(--tx3);font-size:12.5px;line-height:1.8}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--bd);background:var(--sub);border-radius:5px;padding:4px 9px;
  font-size:11.5px;color:var(--tx2);cursor:pointer;font-family:var(--num)}
.chip.on{border-color:var(--acc);background:var(--acc-dim);color:#A9C2FA}
.es{max-width:620px;margin:0 auto;text-align:center;padding:34px 20px}
.es h3{font-size:16px;font-weight:600;margin-bottom:8px}
.es p{font-size:13px;color:var(--tx2);line-height:1.75;margin:0 0 18px}
.es .quick{display:flex;flex-wrap:wrap;gap:7px;justify-content:center;margin-top:6px}
.es .quick button{border:1px solid var(--bd2);background:var(--sub);border-radius:6px;
  padding:6px 11px;font-size:12.5px;color:var(--tx2)}
.es .quick button:hover{border-color:var(--acc);color:#A9C2FA}
.es .quick button b{font-family:var(--num);font-size:10.5px;color:var(--tx3);margin-left:5px}
.posform{display:grid;grid-template-columns:1.6fr 1fr 1fr auto;gap:8px;align-items:end;
  max-width:620px;margin:0 auto;text-align:left}
.posform label{display:block;font-family:var(--num);font-size:10.5px;letter-spacing:.06em;
  text-transform:uppercase;color:var(--tx3);margin-bottom:5px}
.posform input{width:100%;background:var(--sub);border:1px solid var(--bd2);border-radius:6px;
  padding:8px 10px;font-size:13px;color:var(--tx)}
.posform input:focus{outline:none;border-color:var(--acc)}
.demo{display:inline-flex;align-items:center;gap:5px;font-family:var(--num);font-size:10px;
  letter-spacing:.06em;text-transform:uppercase;color:var(--warn);background:var(--warn-dim);
  border:1px solid #4A3714;border-radius:4px;padding:2px 7px}

/* 設定 */
.set-row{display:grid;grid-template-columns:1fr 92px;gap:12px;align-items:center;
  padding:9px 0;border-bottom:1px solid rgba(36,41,54,.5)}
.set-row:last-child{border:0}
.set-row .lab{font-size:12.5px}
.set-row .lab i{display:block;font-style:normal;font-size:11px;color:var(--tx3);margin-top:1px}
.set-row input[type=number]{width:100%;background:var(--sub);border:1px solid var(--bd);
  border-radius:5px;padding:5px 8px;font-family:var(--num);font-size:12.5px;text-align:right}
.set-row input:focus{outline:none;border-color:var(--acc)}
.sw{width:38px;height:21px;border-radius:11px;background:var(--sub);border:1px solid var(--bd);
  position:relative;cursor:pointer;justify-self:end}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:15px;height:15px;border-radius:50%;
  background:var(--tx3);transition:.15s}
.sw.on{background:var(--acc-dim);border-color:var(--acc)}
.sw.on::after{left:20px;background:var(--acc)}
.rule-row{display:grid;grid-template-columns:1fr auto auto;gap:10px;align-items:center;
  padding:10px 0;border-bottom:1px solid rgba(36,41,54,.5)}
.rule-row:last-child{border:0}
.edge-pill{font-family:var(--num);font-size:11px;padding:2px 7px;border-radius:4px;font-weight:600}

/* 操作回饋 */
#toast{position:fixed;left:50%;bottom:28px;transform:translate(-50%,14px);z-index:200;
  display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none;
  opacity:0;transition:.18s;max-width:min(92vw,420px)}
#toast.show{opacity:1;transform:translate(-50%,0)}
.tst{background:var(--card);border:1px solid var(--bd2);border-radius:8px;padding:9px 15px;
  font-size:12.5px;box-shadow:var(--sh);display:flex;align-items:center;gap:9px;
  max-width:100%;text-align:left}
.tst svg{flex-shrink:0}
.tst svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2}
.tst.ok{border-color:#2A5C4E;color:#6EE7C8}
.tst.rm{border-color:#5C2A2E;color:#F0A0A3}
.tst.info{border-color:var(--acc);color:#A9C2FA}

/* 可點擊的資料連結 */
.lnk{color:var(--acc);cursor:pointer;border-bottom:1px dashed rgba(76,125,240,.4)}
.lnk:hover{color:#8FB0F5;border-bottom-style:solid}
.ind-chip{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;padding:2px 8px;

/* ---------- 白話：把 z 換成「20 天內第幾大」 ---------- */

function strength(s){  // 標題用的白話強度

/* ---------- 規則引擎（前端執行，參數來自 CFG） ---------- */
var RULES=[

 {key:"retail_catch", name:"法人出、散戶接",

var RMAP={}; RULES.forEach(function(r){RMAP[r.key]=r;});

/* 分數＝實測超額（不是我拍腦袋定的權重） */
function ruleScore(key,s){
  var e=EDGE[key]; var edge=e?Math.abs(e.excess):0;
  var mag=Math.min(Math.abs(s.fz||0),6);
  return edge*30 + mag*3;
}
function sigsFor(code){
  var s=S[code]; if(!s) return [];
  var out=[];
  RULES.forEach(function(r){
    if(!CFG.on[r.key]) return;
    var ok=false; try{ok=r.test(s);}catch(e){}
    if(!ok) return;
    var e=EDGE[r.key];
    out.push({code:code, key:r.key, name:r.name, head:r.head(s), body:r.body(s),
              score:ruleScore(r.key,s), edge:e?e.excess:null, n:e?e.n:null});
  });
  return out.sort(function(a,b){return b.score-a.score;});
}
function allSigs(){
  var out=[]; CODES.forEach(function(c){out=out.concat(sigsFor(c));});
  return out.sort(function(a,b){return b.score-a.score;});
}

/* ---------- 翻頁數字 ---------- */
var ODO={};        // id -> 目前顯示的字串
function odoHTML(id, txt){
  ODO[id]=txt;
  var h='<span class="odo" data-odo="'+id+'">';
  for(var i=0;i<txt.length;i++){
    var c=txt[i];
    if(c>='0'&&c<='9'){
      h+='<span class="odg"><span class="odc" style="transform:translateY(-'+(+c)+'em)">'
        +'0123456789'.split("").map(function(n){return '<span>'+n+'</span>';}).join("")
        +'</span></span>';
    } else {
      h+='<span class="ods">'+esc(c)+'</span>';
    }
  }
  return h+'</span>';
}
/* 只捲動改變的那幾位，沒變的不動——這樣才像真的翻頁機 */
function odoSet(id, txt){
  var el=document.querySelector('[data-odo="'+id+'"]');
  if(!el){ return; }
  var prev=ODO[id]||"";
  if(prev===txt) return;
  if(prev.length!==txt.length){        // 位數變了就整組重畫
    el.outerHTML=odoHTML(id,txt);
    var n=document.querySelector('[data-odo="'+id+'"]');
    if(n){n.classList.add("tick");setTimeout(function(){n.classList.remove("tick");},600);}
    return;
  }
  ODO[id]=txt;
  var slots=el.children;
  for(var i=0;i<txt.length;i++){
    var c=txt[i], slot=slots[i];
    if(!slot) continue;
    if(c>='0'&&c<='9'&&slot.classList.contains("odg")){
      var col=slot.firstChild;
      if(col) col.style.transform="translateY(-"+(+c)+"em)";
    } else if(slot.classList.contains("ods")){
      slot.textContent=c;
    }
  }
  el.classList.add("tick");
  setTimeout(function(){el.classList.remove("tick");},600);
}

function toWeekly(rows){
  var out=[],cur=null;
  rows.forEach(function(r){
    var d=new Date(r.d+"T00:00:00");
    // 以該週的週一當作這根 K 棒的日期
    var wd=(d.getDay()+6)%7, mon=new Date(d); mon.setDate(d.getDate()-wd);
    var key=mon.toISOString().slice(0,10);
    if(!cur||cur.d!==key){cur={d:key,o:r.o,h:r.h,l:r.l,c:r.c,v:r.v};out.push(cur);}
    else{cur.h=Math.max(cur.h,r.h);cur.l=Math.min(cur.l,r.l);cur.c=r.c;cur.v+=r.v;}
  });
  return out;
}
function shapeRows(rows){
  if(!rows||!rows.length) return rows;
  var r=TF.range?rows.slice(-TF.range):rows;
  return TF.period==="W"?toWeekly(r):r;
}

/* ---------- 圖形 ---------- */
function spark(v,w,h,c,fill){
  if(!v||!v.length) return "";
  var mn=Math.min.apply(null,v), mx=Math.max.apply(null,v), r=(mx-mn)||1;
  var p=v.map(function(x,i){return [i/(v.length-1)*w, h-(x-mn)/r*(h-4)-2];});
  var d=p.map(function(q,i){return (i?"L":"M")+q[0].toFixed(1)+" "+q[1].toFixed(1);}).join(" ");
  return '<svg viewBox="0 0 '+w+' '+h+'" width="100%" height="'+h+'" preserveAspectRatio="none">'
    +(fill?'<path d="'+d+'L'+w+' '+h+'L0 '+h+'Z" fill="'+c+'" opacity=".10"/>':"")
    +'<path d="'+d+'" fill="none" stroke="'+c+'" stroke-width="1.5"/>'
    +'<circle cx="'+p[p.length-1][0].toFixed(1)+'" cy="'+p[p.length-1][1].toFixed(1)+'" r="2.5" fill="'+c+'"/></svg>';
}
function candles(rows,w,h){
  if(!rows||!rows.length) return '<div class="empty">這檔沒有 K 線資料</div>';
  var lo=Math.min.apply(null,rows.map(function(r){return r.l;}));
  var hi=Math.max.apply(null,rows.map(function(r){return r.h;}));
  var pad=(hi-lo)*.06||1; lo-=pad; hi+=pad; var rg=hi-lo;
  var cw=w/rows.length, bw=Math.max(1.5,cw*.6), y=function(v){return h-(v-lo)/rg*h;};
  var grid=[0,.25,.5,.75,1].map(function(f){var yy=(h*f).toFixed(1);
    return '<line x1="0" y1="'+yy+'" x2="'+w+'" y2="'+yy+'" stroke="#242936"/>'
      +'<text x="4" y="'+(+yy-3)+'" fill="#5C6472" font-size="9" font-family="Inter">'+n2(hi-rg*f,0)+'</text>';}).join("");
  var body=rows.map(function(r,i){var x=i*cw+cw/2, up=r.c>=r.o, col=up?"#E5484D":"#12A594";
    var y1=y(Math.max(r.o,r.c)), y2=y(Math.min(r.o,r.c));
    return '<line x1="'+x.toFixed(1)+'" y1="'+y(r.h).toFixed(1)+'" x2="'+x.toFixed(1)+'" y2="'+y(r.l).toFixed(1)
      +'" stroke="'+col+'"/><rect x="'+(x-bw/2).toFixed(1)+'" y="'+y1.toFixed(1)+'" width="'+bw.toFixed(1)
      +'" height="'+Math.max(1,y2-y1).toFixed(1)+'" fill="'+col+'"/>';}).join("");
  return '<svg viewBox="0 0 '+w+' '+h+'" width="100%" height="'+h+'">'+grid+body+'</svg>';
}
function volBars(rows,w,h){
  if(!rows||!rows.length) return "";
  var mx=Math.max.apply(null,rows.map(function(r){return r.v;}))||1, cw=w/rows.length;
  return '<svg viewBox="0 0 '+w+' '+h+'" width="100%" height="'+h+'">'+rows.map(function(r,i){
    var bh=r.v/mx*h;
    return '<rect x="'+(i*cw+cw*.2).toFixed(1)+'" y="'+(h-bh).toFixed(1)+'" width="'+(cw*.6).toFixed(1)
      +'" height="'+bh.toFixed(1)+'" fill="'+(r.c>=r.o?"#E5484D":"#12A594")+'" opacity=".5"/>';}).join("")+'</svg>';
}
function treemap(items,W,H){
  var tot=items.reduce(function(a,b){return a+b.v;},0)||1, out=[], x=0,y=0,w=W,h=H,i=0,list=items.slice();
  function worst(row,len,sc){var s=row.reduce(function(a,b){return a+b.v;},0)*sc;
    var mn=Math.min.apply(null,row.map(function(r){return r.v*sc;}));
    var mx=Math.max.apply(null,row.map(function(r){return r.v*sc;}));
    return Math.max(len*len*mx/(s*s), s*s/(len*len*mn));}
  while(i<list.length){
    var row=[], len=Math.min(w,h), sc=(w*h)/tot;
    while(i<list.length){var nr=row.concat([list[i]]);
      if(row.length&&worst(nr,len,sc)>worst(row,len,sc))break; row=nr;i++;}
    var s=row.reduce(function(a,b){return a+b.v;},0)*sc, th=s/len, off=0;
    row.forEach(function(r){var side=(r.v*sc)/th;
      if(w>=h) out.push({d:r,x:x,y:y+off,w:th,h:side}); else out.push({d:r,x:x+off,y:y,w:side,h:th});
      off+=side;});
    if(w>=h){x+=th;w-=th;}else{y+=th;h-=th;}
    tot-=row.reduce(function(a,b){return a+b.v;},0);
    if(w<=.5||h<=.5||tot<=0) break;
  }
  // 上面若提前結束，剩下的項目要塞進剩餘矩形，不能直接丟掉——
  // 丟掉的話那塊區域會變成空洞（原本的 bug）。
  if(i<list.length && w>0 && h>0){
    var rest=list.slice(i), rt=rest.reduce(function(a,b){return a+b.v;},0)||1, off2=0;
    rest.forEach(function(r){
      var frac=r.v/rt;
      if(w>=h){var hh=h*frac; out.push({d:r,x:x,y:y+off2,w:w,h:hh}); off2+=hh;}
      else     {var ww=w*frac; out.push({d:r,x:x+off2,y:y,w:ww,h:h}); off2+=ww;}
    });
  }
  return out;
}

function compAxis(){
  var ks=Object.keys(RG.components);
  var dir={Trend:1,Momentum:1,Breadth:1,Volume:1,Positioning:1,Sentiment:1};
  var order=ks.slice().sort(function(a,b){return RG.components[a]-RG.components[b];});
  var ticks=[0,25,50,75,100].map(function(t){
    // 最左/最右的刻度文字要往內收，否則會超出容器邊界
    var tx=t===0?'left:0;transform:none':t===100?'right:0;left:auto;transform:none':'left:'+t+'%';
    return '<div class="grid-l" style="left:'+t+'%"></div>'
      +'<div class="grid-t" style="'+tx+'">'+t+'</div>';}).join("");
  var marks=order.map(function(k,i){
    var v=RG.components[k];
    var col=dir[k]?(v>=60?"var(--up)":v<=40?"var(--down)":"var(--tx2)"):"var(--acc)";
    var row=i%4, top=4+row*36;
    // 標記離軸線越遠，用越長的細線連回去，否則看不出它對應哪個位置
    var stemH=Math.max(0,138-(top+34));
    return '<div class="axm" style="left:'+v+'%;top:'+top+'px" title="'+(CN[k]||k)+' '+v+'">'
      +'<div class="v" style="color:'+col+'">'+v+'</div>'

      +(stemH>4?'<div class="stem" style="top:'+(34+14)+'px;height:'+stemH+'px"></div>':'')
      +'</div>';}).join("");
  return '<div class="sec-t"><b>分項強度</b><span>同一條 0–100 軸 · 越右越強 · 中間灰帶為中性區</span></div>'
   +'<div class="axis"><div class="band" style="left:40%;width:20%"></div>'
   +'<div class="base"></div>'+ticks+marks+'</div>';
}

var _hmRO=null;
function drawHeat(){
  var box=$("#hm"); if(!box) return;
  var W=box.clientWidth,H=box.clientHeight;
  if(W<50||H<50){
    // 容器還沒有真實尺寸（背景分頁、剛掛載、視窗尚未 layout）。
    // 等它拿到尺寸再畫，否則會永遠空白。
    if(window.ResizeObserver&&!_hmRO){
      _hmRO=new ResizeObserver(function(){
        var b=$("#hm");
        if(b&&b.clientWidth>=50&&b.clientHeight>=50){_hmRO.disconnect();_hmRO=null;drawHeat();}
      });
      _hmRO.observe(box);
    }
    return;
  }
  if(_hmRO){_hmRO.disconnect();_hmRO=null;}
  // 全市場，不只深度分析的那 400 檔。LITE = [名稱, 收盤, 漲跌, 成交金額, 產業]
  var byInd={};
  function put(c,name,chg,tv,ind){
    if(!tv||chg==null) return;
    (byInd[ind||"其他"]=byInd[ind||"其他"]||[]).push({c:c,v:tv,p:chg,n:name});
  }
  CODES.forEach(function(c){var s=S[c]; put(c,s.name,s.chg,s.turnover,s.ind);});
  Object.keys(LITE).forEach(function(c){var d=LITE[c]; put(c,d[0],d[2],d[3],d[4]);});

  var groups=Object.keys(byInd).map(function(k){
      var items=byInd[k].sort(function(a,b){return b.v-a.v;}).slice(0,60);
      // 外框大小必須用「實際會畫出來的那些」加總，否則切掉的部分會在格子裡留下破洞
      return {k:k, items:items, v:items.reduce(function(a,b){return a+b.v;},0)};})
    .filter(function(g){return g.items.length>=2 && g.v>0;})
    .sort(function(a,b){return b.v-a.v;}).slice(0,18);
  var html="";
  treemap(groups.map(function(g){return {k:g.k,v:g.v,g:g};}),W,H).forEach(function(cell){
    var g=cell.d.g, pad=cell.h>34?13:2;
    html+='<div class="hm-grp" style="left:'+cell.x+'px;top:'+cell.y+'px;width:'+cell.w+'px;height:'+cell.h+'px"></div>';
    if(cell.w>62&&cell.h>34) html+='<div class="hm-lab" style="left:'+(cell.x+3)+'px;top:'+(cell.y+2)+'px">'+esc(g.k)+'</div>';
    var iw=Math.max(1,cell.w-4), ih=Math.max(1,cell.h-pad-3);

function scanRows(){
  var q=($("#fq")&&$("#fq").value||"").trim().toLowerCase();
  return CODES.filter(function(c){var s=S[c];
    if(q&&c.toLowerCase().indexOf(q)<0&&s.name.toLowerCase().indexOf(q)<0) return false;
    if(IND && s.ind!==IND) return false;
    if(SCF==="sig") return sigsFor(c).length>0;
    if(SCF==="up") return s.chg>0;
    if(IND && s.ind!==IND) return false;
    if(SCF==="fin") return s.fnet>0;
    return true;})
   .sort(function(a,b){var x=S[a][SORT.k],y=S[b][SORT.k];
     if(x==null)return 1; if(y==null)return -1;
     // SORT.d = -1 代表降冪（大的在前）；多乘一個 -1 會把方向弄反
     if(typeof x==="string")return x.localeCompare(y)*SORT.d;
     return (x-y)*SORT.d;});
}

function kv(k,v,c){return '<div class="kv"><span>'+k+'</span><b class="'+(c||"")+'">'+v+'</b></div>';}
function ma(rows,n){
  if(!rows||rows.length<n) return null;
  var t=rows.slice(-n).reduce(function(a,r){return a+r.c;},0);
  return t/n;
}
function priceStructCard(rows){
  if(!rows||rows.length<5) return "";
  var last=rows[rows.length-1].c;
  function hiLo(n){var r=rows.slice(-n);
    return {h:Math.max.apply(null,r.map(function(x){return x.h;})),
            l:Math.min.apply(null,r.map(function(x){return x.l;}))};}
  var w20=hiLo(20), w60=hiLo(Math.min(60,rows.length));
  var pos=(last-w60.l)/((w60.h-w60.l)||1)*100;
  var m5=ma(rows,5), m20=ma(rows,20), m60=ma(rows,60);
  var mline=function(lab,v){return v==null?kv(lab,"—","fa")
    :kv(lab,n2(v)+"　"+(last>=v?"站上":"跌破"),last>=v?"up":"dn");};
  return '<div class="card"><div class="ch"><h3>價格結構</h3>'
   +'<span class="hint">高低點與均線，非預測</span></div><div class="cb">'
   +'<div class="kv"><span>60 日區間位置</span><b>'+n2(pos,0)+'%</b></div>'
   +'<div class="mini" style="height:6px;margin:2px 0 10px"><i style="width:'+Math.max(2,Math.min(100,pos))
   +'%;background:'+(pos>=70?"var(--up)":pos<=30?"var(--down)":"var(--acc)")+'"></i></div>'
   +kv("20 日高 / 低",n2(w20.h)+" / "+n2(w20.l),"")
   +kv("60 日高 / 低",n2(w60.h)+" / "+n2(w60.l),"")
   +mline("MA5",m5)+mline("MA20",m20)+mline("MA60",m60)
   +'</div></div>';}

function stratMatch(){
  return CODES.filter(function(c){
    var s=S[c];
    return STRAT.cond.every(function(x){
      var v=s[x.f];
      if(v==null) return false;
      return x.op===">="? v>=x.v : v<=x.v;
    });
  }).sort(function(a,b){return (S[b].score||0)-(S[a].score||0);});
}

function drawLWC(){
  var box=document.getElementById("lwc"); if(!box) return;
  var rows=shapeRows(ohlcOf(cur));
  var LW=window.LightweightCharts;
  if(!LW||!rows||!rows.length){          // 函式庫沒載到（離線 / CSP）就用自繪版
    if(box) box.hidden=true;
    var fb=document.getElementById("lwcfb"); if(fb) fb.hidden=false;
    return;
  }
  box.innerHTML="";
  var chart=LW.createChart(box,{
    layout:{background:{color:"transparent"},textColor:"#8B93A3",
            fontFamily:'"Inter",system-ui,sans-serif',fontSize:11},
    grid:{vertLines:{color:"rgba(36,41,54,.55)"},horzLines:{color:"rgba(36,41,54,.55)"}},
    rightPriceScale:{borderColor:"#242936",scaleMargins:{top:.08,bottom:.26}},
    timeScale:{borderColor:"#242936",timeVisible:false},
    crosshair:{mode:LW.CrosshairMode.Normal,
      vertLine:{color:"#4C7DF0",width:1,style:2,labelBackgroundColor:"#4C7DF0"},
      horzLine:{color:"#4C7DF0",width:1,style:2,labelBackgroundColor:"#4C7DF0"}},
    handleScale:{axisPressedMouseMove:true}, autoSize:true
  });
  // 台灣慣例：紅漲綠跌（跟國際相反，所以要明確指定）
  var UP="#E5484D", DN="#12A594";
  var cs=chart.addCandlestickSeries({upColor:UP,downColor:DN,borderUpColor:UP,
    borderDownColor:DN,wickUpColor:UP,wickDownColor:DN});
  cs.setData(rows.map(function(r){return {time:r.d,open:r.o,high:r.h,low:r.l,close:r.c};}));
  var vs=chart.addHistogramSeries({priceFormat:{type:"volume"},priceScaleId:"vol"});
  chart.priceScale("vol").applyOptions({scaleMargins:{top:.8,bottom:0}});
  vs.setData(rows.map(function(r){return {time:r.d,value:r.v,
    color:(r.c>=r.o?"rgba(229,72,77,.45)":"rgba(18,165,148,.45)")};}));
  chart.timeScale().fitContent();
  if(window._lwc){try{window._lwc.remove();}catch(e){}}
  window._lwc=chart;
}

  var g=t.closest("[data-go]"); if(g){location.hash=g.dataset.go;return;}
  var sw=t.closest(".sw");
  if(sw){
    if(sw.dataset.rule){CFG.on[sw.dataset.rule]=CFG.on[sw.dataset.rule]?0:1;}
    else if(sw.dataset.flag){CFG[sw.dataset.flag]=CFG[sw.dataset.flag]?0:1;}
    saveCfg(); go(location.hash.slice(1)||"overview");
    if(sw.dataset.rule) toast((CFG.on[sw.dataset.rule]?"已啟用 ":"已關閉 ")+RMAP[sw.dataset.rule].name,
                              CFG.on[sw.dataset.rule]?"ok":"rm");
    else toast(CFG.plain?"改用白話顯示":"改用 z 分數顯示","info");
    return;}
  if(t.id==="reset"){CFG=JSON.parse(JSON.stringify(DEF));saveCfg();go("settings");toast("已恢復預設設定","info");return;}
  if(t.id==="clearall"){
    try{localStorage.removeItem("tl_cfg");localStorage.removeItem("tl_watch");localStorage.removeItem("tl_pos");}catch(e){}
    CFG=JSON.parse(JSON.stringify(DEF)); watch=[]; POS=[]; RECENT=[]; go("settings");
    toast("已清除本機所有資料","rm"); return;}
  if(t.id==="togglepos"){var b=$("#posbox"); if(b){b.hidden=!b.hidden; if(!b.hidden)$("#pf-c").focus();} return;}
  if(t.id==="pf-add"){
    var c=($("#pf-c").value||"").trim();
    if(!S[c]){ // 允許直接輸入名稱
      var hit=CODES.filter(function(k){return S[k].name===c;});
      if(hit.length) c=hit[0];
    }
    if(!S[c]){toast("找不到這檔，或不在深度分析範圍內","rm");$("#pf-c").focus();return;}
    var n=parseFloat($("#pf-n").value), px=parseFloat($("#pf-p").value);
    if(!(n>0)){toast("股數要大於 0","rm");$("#pf-n").focus();return;}
    if(!(px>0)){toast("成本價要大於 0","rm");$("#pf-p").focus();return;}
    POS.push({c:c,n:n,px:px}); savePos(); go("portfolio");
    toast("已加入 "+S[c].name+" "+n2(n,0)+" 股"); return;}
  var aw=t.closest("[data-addwatch]");
  if(aw){var code=aw.dataset.addwatch;
    if(watch.indexOf(code)<0) watch.push(code);
    saveWatch(); go("watch"); toast("已加入自選 "+S[code].name); return;}
  var aw5=t.closest("[data-addwatch5]");
  if(aw5){aw5.dataset.addwatch5.split(",").forEach(function(code){
      if(S[code]&&watch.indexOf(code)<0) watch.push(code);});
    saveWatch(); go("watch"); toast("已加入 "+watch.length+" 檔自選"); return;}
  var del=t.closest("[data-del]");
  if(del){POS.splice(+del.dataset.del,1);savePos();go("portfolio");toast("已移除部位","rm");return;}
  var tfb=t.closest("[data-tf]");
  if(tfb){TF.period=tfb.dataset.tf;saveTF();go("stock");
    toast(TF.period==="W"?"切換為週 K":"切換為日 K","info");return;}
  var trb=t.closest("[data-tr]");
  if(trb){TF.range=+trb.dataset.tr;saveTF();go("stock");
    toast(TF.range?("顯示最近 "+TF.range+" 根"):"顯示全部","info");return;}
  var pg=t.closest("[data-pg]"); if(pg){PAGE+=+pg.dataset.pg;drawScanner();return;}
  var th=t.closest("th[data-k]");
  if(th){if(SORT.k===th.dataset.k)SORT.d*=-1; else {SORT.k=th.dataset.k;SORT.d=-1;} PAGE=0; drawScanner(); return;}
  var ch=t.closest(".chip[data-k]");
  if(ch){document.querySelectorAll(".chip").forEach(function(x){x.classList.toggle("on",x===ch);});
    var k=ch.dataset.k, sg2=allSigs();
    $("#feed").innerHTML=(k?sg2.filter(function(x){return x.key===k;}):sg2).slice(0,80).map(evRow).join("")
      ||'<div class="empty">沒有這類訊號</div>'; return;}
  var f=t.closest("[data-f]");
  if(f){SCF=f.dataset.f;PAGE=0;
    document.querySelectorAll("[data-f]").forEach(function(b){b.classList.toggle("on",b===f);});drawScanner();return;}
  if(t.id==="wbtn"){var i=watch.indexOf(cur), nm=S[cur].name;
    if(i>=0){watch.splice(i,1);saveWatch();go("stock");toast("已從自選移除 "+nm,"rm");}
    else{watch.push(cur);saveWatch();go("stock");toast("已加入自選 "+nm+"（共 "+watch.length+" 檔）");}
    return;}
  if(t.closest("[data-clearind]")){IND="";PAGE=0;go("scanner");toast("已清除產業篩選","info");return;}
  var ind=t.closest("[data-ind]");
  if(ind){IND=ind.dataset.ind;PAGE=0;SCF="all";location.hash="scanner";
    if(location.hash==="#scanner")go("scanner");
    toast("已篩選："+IND,"info");return;}
  var c2=t.closest("[data-code]");
  if(c2){cur=c2.dataset.code; if(location.hash==="#stock") go("stock"); else location.hash="stock"; return;}
});
document.addEventListener("input",function(e){
  if(e.target.id==="fq"){PAGE=0;drawScanner();return;}
  var k=e.target.dataset&&e.target.dataset.cfg;
  if(k){var v=parseFloat(e.target.value); if(!isNaN(v)){CFG[k]=v;saveCfg();
    e.target.classList.remove("flash"); void e.target.offsetWidth; e.target.classList.add("flash");}}
});
document.addEventListener("change",function(e){
  if(e.target.dataset&&e.target.dataset.cfg) go(location.hash.slice(1)||"overview");
});

/* 全站搜尋：涵蓋全市場，不在收錄範圍的標示出來 */
var q=$("#q"), qr=$("#qr"), SEL=-1, HITS=[], ROWS=[];

/* 相關度排序：代號完全符合 > 名稱完全符合 > 代號前綴 > 名稱前綴 > 包含 > 產業。
   同分時，有深度指標的排前面，再看訊號數。 */
function scoreHit(t, code, name, ind){
  var c=String(code).toLowerCase(), n=String(name||"").toLowerCase(), i=String(ind||"").toLowerCase();
  if(c===t) return 100;
  if(n===t) return 95;
  if(c.indexOf(t)===0) return 82;
  if(n.indexOf(t)===0) return 74;
  if(c.indexOf(t)>=0) return 52;
  if(n.indexOf(t)>=0) return 46;
  if(i.indexOf(t)>=0) return 22;
  return 0;
}
function searchAll(raw){
  var t=String(raw||"").trim().toLowerCase();
  if(!t) return [];
  var out=[];
  CODES.forEach(function(c){
    var st=S[c], sc=scoreHit(t,c,st.name,st.ind);
    if(sc) out.push({c:c,name:st.name,close:st.close,chg:st.chg,ind:st.ind,
                     sig:sigsFor(c).length, lite:0, sc:sc+8});
  });
  Object.keys(LITE).forEach(function(c){
    var d=LITE[c], sc=scoreHit(t,c,d[0],d[4]);
    if(sc) out.push({c:c,name:d[0],close:d[1],chg:d[2],ind:d[4],sig:0,lite:1,sc:sc});
  });
  out.sort(function(a,b){ return (b.sc-a.sc) || (b.sig-a.sig)
    || ((b.close||0)-(a.close||0)); });
  return out.slice(0,18);
}
/* 產業命中可能不只一個：打「電」會同時命中電子工業、光電業、電機機械…
   全部列出來讓使用者選，比只猜一個有用。單字也要能查。 */
function matchedIndustries(raw){
  var t=String(raw||"").trim().toLowerCase();
  if(!t) return [];
  var out=[];
  Object.keys(D.industries||{}).forEach(function(k){
    var kl=k.toLowerCase(), sc=0;
    if(kl===t) sc=3; else if(kl.indexOf(t)===0) sc=2; else if(kl.indexOf(t)>=0) sc=1;
    if(sc) out.push({k:k, sc:sc, g:D.industries[k]});
  });
  out.sort(function(a,b){ return (b.sc-a.sc) || (b.g.turnover-a.g.turnover); });
  return out.slice(0,5);
}
/* ROWS 把產業與個股併成一份清單，鍵盤才能連續上下移動 */
function buildRows(){
  var rows=[];
  matchedIndustries(q.value).forEach(function(x){
    rows.push({t:"ind", k:x.k, n:x.g.n, chg:x.g.chg});
  });
  HITS.filter(function(h){return !h.lite;}).forEach(function(h){rows.push({t:"stock",h:h});});
  HITS.filter(function(h){return h.lite;}).forEach(function(h){rows.push({t:"lite",h:h});});
  return rows;
}
function rowHTML(r,i){
  var on=(i===SEL?' sel':'');
  if(r.t==="ind"){
    return '<li class="indrow'+on+'" data-i="'+i+'"><span class="cd">產業</span>'
      +esc(r.k)+'<span class="ind">'+r.n+' 檔</span>'
      +'<span class="pc '+cls(r.chg)+'">'+(r.chg>0?"+":"")+n2(r.chg)+'%</span></li>';
  }
  var h=r.h;
  return '<li class="'+(r.t==="lite"?"lite-row":"")+on+'" data-i="'+i+'">'
    +'<span class="cd">'+h.c+'</span>'+esc(h.name)
    +(h.ind?'<span class="ind">'+esc(h.ind)+'</span>':'')
    +(h.sig?'<span class="nsig">'+h.sig+' 訊號</span>':'')
    +(r.t==="lite"?'<span class="lite">僅報價</span>':'')
    +'<span class="pc '+cls(h.chg)+'">'+(h.chg>0?"+":"")+n2(h.chg)+'%</span></li>';
}
function renderHits(){
  ROWS=buildRows();
  if(!ROWS.length){
    qr.innerHTML = q.value.trim()
      ? '<div class="none">找不到「'+esc(q.value.trim())+'」<br>'
        +'<span class="fa">可以試試代號、公司名稱，或產業（例如「電」「金融」）</span></div>' : "";
    return;
  }
  var nInd=ROWS.filter(function(r){return r.t==="ind";}).length;
  var nDeep=ROWS.filter(function(r){return r.t==="stock";}).length;
  var nLite=ROWS.filter(function(r){return r.t==="lite";}).length;
  var html='<div class="hdr"><span>'
    +[nInd?nInd+' 產業':'', nDeep?nDeep+' 檔':'', nLite?nLite+' 僅報價':'']
      .filter(Boolean).join(' · ')
    +'</span><span>↑↓ 選取 · Enter 開啟</span></div>';
  var lastT=null;
  ROWS.forEach(function(r,i){
    if(r.t!==lastT){
      var lab={ind:"產業",stock:"個股",lite:"僅有報價（不在深度分析範圍）"}[r.t];
      html+='<div class="grp">'+lab+'</div>';
      lastT=r.t;
    }
    html+=rowHTML(r,i);
  });
  qr.innerHTML=html;
  var sel=qr.querySelector('li.sel');
  if(sel) sel.scrollIntoView({block:"nearest"});
}
function pick(i){
  var r=ROWS[i]; if(!r) return;
  if(r.t==="ind"){
    IND=r.k; PAGE=0; SCF="all"; q.value=""; qr.innerHTML=""; SEL=-1;
    if(location.hash==="#scanner") go("scanner"); else location.hash="scanner";
    toast("已篩選："+IND,"info"); return;
  }
  if(r.t==="lite"){ toast(r.h.name+" 不在深度分析範圍內，只有報價","info"); return; }
  cur=r.h.c; q.value=""; qr.innerHTML=""; SEL=-1;
  if(location.hash==="#stock") go("stock"); else location.hash="stock";
}
q.addEventListener("input",function(){ SEL=-1; HITS=searchAll(q.value); renderHits(); });
q.addEventListener("keydown",function(e){
  if(!ROWS.length) return;
  if(e.key==="ArrowDown"){e.preventDefault(); SEL=Math.min(SEL+1,ROWS.length-1); renderHits();}
  else if(e.key==="ArrowUp"){e.preventDefault(); SEL=Math.max(SEL-1,0); renderHits();}
  else if(e.key==="Enter"){e.preventDefault(); pick(SEL<0?0:SEL);}
  else if(e.key==="Escape"){q.value="";qr.innerHTML="";SEL=-1;}
});
qr.addEventListener("click",function(e){
  var li=e.target.closest("li[data-i]"); if(!li) return;
  pick(+li.dataset.i);
});
document.addEventListener("click",function(e){
  if(!e.target.closest(".srch")){qr.innerHTML="";SEL=-1;}
});
window.addEventListener("resize",function(){ if(location.hash==="#heatmap") drawHeat(); });

$("#sideft").innerHTML="資料 "+D.asof+"（收盤）<br>全市場 "+D.universe.toLocaleString()+" 檔 · 深度分析 "+CODES.length;
$("#mstat").innerHTML='收盤 '+D.asof+' <span class="'+cls(M.pct)+'">'+(M.pct>0?"+":"")+n2(M.pct)+'%</span>';
/* ---------- 自動更新 ----------
   artifact 版的 CSP 擋掉所有 fetch，這裡會安靜失敗並顯示「靜態快照」。
   自架版才抓得到同源的 tradelab.json；實測證交所盤中即時端點被 CORS 擋，
   所以「即時」的上限就是資料檔本身的更新頻率。 */
var LIVE={last:null, timer:null, ok:false, ms:60000, gen:D.generated};
function liveBar(){
  var el=document.getElementById("live"); if(!el) return;
  var t=LIVE.last?LIVE.last.toTimeString().slice(0,8):"—";
  el.className="live"+(LIVE.ok?"":" off");
  el.innerHTML='<span class="pulse"></span>'
    +(LIVE.ok?('自動更新中 · 上次檢查 '+t):'靜態快照 · 資料 '+D.asof);
}
function applyLive(nd){
  if(!nd||!nd.market) return;
  var m=nd.market;
  odoSet("idx",n2(m.index));
  odoSet("tv",yi(m.turnover));
  var b=m.adv/((m.adv+m.dec)||1)*100;
  odoSet("br",n2(b,1)+"%");
  if(nd.futures){
    odoSet("fut",n2(nd.futures.close,0));
    odoSet("foi",(nd.futures.fgnNetOi>0?"+":"")+n2(nd.futures.fgnNetOi,0));
  }
  if(nd.asof!==D.asof){        // 換日了就整頁重繪，數字動畫救不了整頁結構
    D=nd; S=D.stocks; CODES=Object.keys(S); M=D.market; RG=D.regime;
    go(location.hash.slice(1)||"overview");
    toast("資料已更新至 "+D.asof);
  }
}
async function poll(){
  try{
    // 先抓幾百 bytes 的 meta 判斷有沒有變，沒變就不用拉 1MB 的主檔
    var r=await fetch("meta.json?t="+Date.now(),{cache:"no-store"});
    if(!r.ok) throw 0;
    var meta=await r.json();
    LIVE.ok=true; LIVE.last=new Date();
    if(meta.generated!==LIVE.gen){
      var full=await fetch("tradelab.json?t="+Date.now(),{cache:"no-store"});
      if(full.ok){
        var nd=await full.json();
        var first=!LIVE.gen;
        LIVE.gen=meta.generated;
        if(!first) applyLive(nd);
      }
    }
  }catch(e){ LIVE.ok=false; }
  liveBar();
}
function startLive(){
  if(LIVE.timer) clearInterval(LIVE.timer);
  poll();
  LIVE.timer=setInterval(poll,LIVE.ms);
}

buildNav();
go(location.hash.slice(1)||"overview");
startLive();
})();
</script>
